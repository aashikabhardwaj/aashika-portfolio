<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmCart API Documentation</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #1B5E20;
      color: white;
    }

    pre {
      overflow-x: auto;
      background: #f4f4f4;
      padding: 12px;
    }
  </style>
</head>
<body>
  <h1>FarmCart API Documentation</h1>
  <div id="documentation">Loading documentation...</div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch("/docs/api-documentation.md")
      .then(response => {
        if (!response.ok) throw new Error("Documentation file not found");
        return response.text();
      })
      .then(markdown => {
        document.getElementById("documentation").innerHTML =
          marked.parse(markdown);
      })
      .catch(() => {
        document.getElementById("documentation").textContent =
          "Could not load API documentation. Check that api-documentation.md is inside public/docs.";
      });
  </script>
</body>
</html>
